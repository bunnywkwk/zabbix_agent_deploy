---
# Shared by the clusters that use ansible.posix.acl (host_health and the
# audit-based ones). setfacl/getfacl come from the acl package, which is
# not on every fresh install (e.g. RHEL 10.1 minimal).
- name: Ensure the acl package is installed (setfacl/getfacl)
  ansible.builtin.dnf:
    name: acl
    state: present
