---
- name: Ensure firewalld allows Zabbix Agent port 10050
  ansible.posix.firewalld:
    port: 10050/tcp
    permanent: true
    immediate: true
    state: enabled

- name: Ensure Zabbix Agent 2 is enabled and running
  ansible.builtin.systemd:
    name: zabbix-agent2
    state: started
    enabled: true
