---
# setfacl/getfacl come from the acl package, which isn't guaranteed to be
# present on a minimal RHEL 9/10 install - ansible.posix.acl shells out to
# the setfacl binary, so it has to exist first. disablerepo: epel for the
# same reason as the install tasks - EPEL's baseurl is broken in this
# environment and would otherwise fail this dnf call too.
- name: Ensure the acl package is installed (setfacl/getfacl)
  ansible.builtin.dnf:
    name: acl
    state: present
    disablerepo: epel

- name: Grant zabbix read access to /var/log/messages (Host Health cluster)
  ansible.posix.acl:
    path: /var/log/messages
    entity: zabbix
    etype: user
    permissions: r
    state: present
