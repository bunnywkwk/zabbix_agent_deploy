---
# Deploys the libvirt UserParameters and their matching sudoers grant for
# the Virtualisation cluster.
- name: Deploy libvirt UserParameter config (Virtualisation cluster)
  ansible.builtin.copy:
    src: zabbix_virtualisation.conf
    dest: /etc/zabbix/zabbix_agent2.d/zabbix_virtualisation.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Zabbix Agent 2

- name: Grant zabbix least-privilege sudo access to virsh (Virtualisation cluster)
  ansible.builtin.copy:
    src: zabbix_virtualisation.sudoers
    dest: /etc/sudoers.d/zabbix_virtualisation
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
