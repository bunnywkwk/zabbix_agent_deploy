# /etc/zabbix/zabbix_agent2.d/zabbix_lvm.conf   (mode 0644, owner root:root)
#
# UserParameters backing the Storage & Filesystem cluster's LVM discovery
# and capacity items. No native Zabbix plugin covers Logical Volumes.
UserParameter=lvm.vg.discovery, sudo /usr/sbin/vgs --noheadings -o vg_name | sed -e 's/^[ \t]*//' | grep -v '^$' | awk '{printf "{\"{#VGNAME}\":\"%s\"}\n", $1}' | paste -sd, | sed -e 's/^/[/' -e 's/$/]/'
UserParameter=lvm.vg.size[*], sudo /usr/sbin/vgs --noheadings --units b -o vg_size $1 | sed -e 's/^[ \t]*//' -e 's/B//'
UserParameter=lvm.vg.free[*], sudo /usr/sbin/vgs --noheadings --units b -o vg_free $1 | sed -e 's/^[ \t]*//' -e 's/B//'
