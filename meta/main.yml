galaxy_info:
  author: bunnywkwk
  description: Installs and configures Zabbix Agent 2 on monitored RHEL 9/10 hosts, including the host-side access each linked requirement cluster's items need.

  license: MIT-0

  min_ansible_version: "2.14"

  galaxy_tags:
    - zabbix
    - monitoring
    - rhel

dependencies: []
  # No other Ansible roles required.
  #
  # This role does depend on the ansible.posix collection (for the acl and
  # firewalld modules used across tasks/) - not expressible here, same
  # reason as the other two roles: this `dependencies:` field only
  # resolves other Galaxy roles, not collections. Tracked in the
  # playbook-level requirements.yml instead.
